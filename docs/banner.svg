<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="IntelScope: an OSINT desk with built-in IOC triage">
  <rect width="1200" height="300" fill="#099197"/>
  <!-- palette stripe: Sanzo Wada combinations #11, #12, #15 -->
  <g>
    <rect x="0"   y="282" width="200" height="18" fill="#ebd3a2"/>
    <rect x="200" y="282" width="200" height="18" fill="#a2b0ad"/>
    <rect x="400" y="282" width="200" height="18" fill="#c5a56e"/>
    <rect x="600" y="282" width="200" height="18" fill="#099197" stroke="#0b7c81" stroke-width="2"/>
    <rect x="800" y="282" width="200" height="18" fill="#00978d"/>
    <rect x="1000" y="282" width="200" height="18" fill="#b5b1d8"/>
  </g>
  <!-- scope reticle -->
  <g transform="translate(1000 140)" fill="none" stroke-linecap="round">
    <circle r="92" stroke="#ebd3a2" stroke-width="6"/>
    <circle r="62" stroke="#b5b1d8" stroke-width="3" stroke-dasharray="6 10"/>
    <circle r="30" stroke="#c5a56e" stroke-width="5"/>
    <line x1="-120" y1="0" x2="-44" y2="0" stroke="#ebd3a2" stroke-width="5"/>
    <line x1="44" y1="0" x2="120" y2="0" stroke="#ebd3a2" stroke-width="5"/>
    <line x1="0" y1="-120" x2="0" y2="-44" stroke="#ebd3a2" stroke-width="5"/>
    <line x1="0" y1="44" x2="0" y2="120" stroke="#ebd3a2" stroke-width="5"/>
    <circle r="8" fill="#c5a56e" stroke="none"/>
  </g>
  <text x="72" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" fill="#ebd3a2" letter-spacing="1">IntelScope</text>
  <text x="76" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#f6ecd6">An OSINT desk with IOC triage built in</text>
  <g font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="17">
    <!-- verdict pills: every glyph sits in its own fixed 24px slot, so nothing clips the pill -->
    <rect x="76" y="214" width="150" height="32" rx="16" fill="#c5a56e"/>
    <g transform="translate(92 221) scale(1.125)" fill="#1f2a2b"><path d="M8 1l3.5 7h-7zM4.5 8L8 15H1zM11.5 8L15 15H8z"/></g>
    <text x="124" y="236" fill="#1f2a2b">malicious</text>
    <rect x="236" y="214" width="150" height="32" rx="16" fill="#ebd3a2"/>
    <text x="252" y="236" fill="#1f2a2b">▲▲</text>
    <text x="284" y="236" fill="#1f2a2b">suspicious</text>
    <rect x="396" y="214" width="84" height="32" rx="16" fill="#b5b1d8"/>
    <text x="412" y="236" fill="#1f2a2b">▲</text>
    <text x="432" y="236" fill="#1f2a2b">low</text>
    <rect x="490" y="214" width="118" height="32" rx="16" fill="#a2b0ad"/>
    <text x="506" y="236" fill="#1f2a2b">?</text>
    <text x="526" y="236" fill="#1f2a2b">unknown</text>
    <rect x="618" y="214" width="106" height="32" rx="16" fill="#00978d" stroke="#ebd3a2" stroke-width="1.5"/>
    <text x="634" y="236" fill="#1f2a2b">✓</text>
    <text x="656" y="236" fill="#1f2a2b">benign</text>
  </g>
</svg>
